<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basketball Bounce Audio Classifier</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 0 20px;
        }
        button {
            font-size: 16px;
            padding: 10px 20px;
            cursor: pointer;
        }
        #label-container div {
            padding: 8px;
            margin-top: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            font-family: monospace;
        }
        #status {
            margin-top: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>Teachable Machine Audio Model</h1>
    <button type="button" id="start-btn">Start Listening</button>
    <div id="status"></div>
    <div id="label-container"></div>

    <!-- TensorFlow.js and Speech Commands libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

    <script type="text/javascript">
        // IMPORTANT: This path is relative to THIS html file's location.
        // This file expects to sit next to a "Model" folder, e.g.:
        //   bounce/
        //     bball.html   <- this file
        //     Model/
        //       bball_bounce/
        //         model.json
        //         metadata.json
        //
        // You MUST load this page through a local web server (not by
        // double-clicking the file), e.g. from the parent of "bounce":
        //   python3 -m http.server 8000
        // then visit:
        //   http://localhost:8000/bounce/bball.html
        // Build an ABSOLUTE URL (https://...) from the relative path.
        // The speech-commands library checks the literal string prefix of
        // the URL and requires it to start with http://, https://, or
        // file://. A relative path like "./Model/..." is NOT resolved by
        // the library itself, so it fails that check even though it would
        // resolve fine in a normal fetch(). Converting it explicitly here
        // fixes that, and works both locally and on GitHub Pages.
        const MODEL_URL = new URL("./Model/bball_bounce/", window.location.href).href;

        let recognizer;
        const statusEl = document.getElementById("status");
        const labelContainer = document.getElementById("label-container");
        const startBtn = document.getElementById("start-btn");

        async function createModel() {
            const checkpointURL = MODEL_URL + "model.json";
            const metadataURL = MODEL_URL + "metadata.json";

            const recognizer = speechCommands.create(
                "BROWSER_FFT",
                undefined,
                checkpointURL,
                metadataURL
            );

            await recognizer.ensureModelLoaded();
            return recognizer;
        }

        async function init() {
            startBtn.disabled = true;
            statusEl.textContent = "Loading model...";

            try {
                recognizer = await createModel();
            } catch (err) {
                statusEl.textContent = "Error loading model: " + err.message;
                console.error(err);
                startBtn.disabled = false;
                return;
            }

            statusEl.textContent = "Model loaded. Listening for sound...";

            const classLabels = recognizer.wordLabels();
            labelContainer.innerHTML = "";
            for (let i = 0; i < classLabels.length; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }

            recognizer.listen(result => {
                const scores = result.scores;
                for (let i = 0; i < classLabels.length; i++) {
                    labelContainer.childNodes[i].innerHTML =
                        classLabels[i] + ": " + scores[i].toFixed(2);
                }
            }, {
                includeSpectrogram: true,
                probabilityThreshold: 0.75,
                invokeCallbackOnNoiseAndUnknown: true,
                overlapFactor: 0.50
            });

            // Uncomment to auto-stop after 5 seconds:
            // setTimeout(() => recognizer.stopListening(), 5000);
        }

        startBtn.addEventListener("click", init);
    </script>
</body>
</html>
